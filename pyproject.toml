[project]
name = "client-voice-agent"
version = "1.0.0"
description = "A LiveKit and Rime reference agent for building with a nontechnical customer."
requires-python = ">=3.11,<3.15"
readme = "README.md"
license = "MIT"
dependencies = [
    "livekit-agents>=1.5,<2",
    "python-dotenv>=1.2.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "ruff==0.15.20",
    "ty==0.0.56",
]

[build-system]
requires = ["uv_build>=0.8.9,<0.9.0"]
build-backend = "uv_build"

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true

[tool.pytest.ini_options]
addopts = "--cov --cov-report=term-missing"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
